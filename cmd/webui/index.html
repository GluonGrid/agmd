<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agmd board</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">◧</span> agmd <small>tasks</small></div>
    <nav class="nav">
      <button class="nav-item" data-project="" id="nav-all">
        <span class="nav-icon">▦</span><span class="nav-name">All projects</span><span class="nav-count" id="count-all"></span>
      </button>
      <div class="nav-label">Projects</div>
      <div id="project-list"></div>
    </nav>
    <div class="sidebar-foot">
      <button class="foot-btn hidden" id="btn-runs" title="Claude Code runs started from this board">
        <span class="nav-icon">▶</span> Runs <span class="pill" id="runs-badge">0</span>
      </button>
      <button class="foot-btn" id="btn-theme" title="Switch theme"><span class="nav-icon" id="theme-icon">◐</span> <span id="theme-label">System theme</span></button>
      <div class="keys"><kbd>n</kbd> new · <kbd>/</kbd> filter · <kbd>esc</kbd> close</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="title-block">
        <h1 id="board-title">All projects</h1>
        <span class="subtle" id="board-sub"></span>
      </div>
      <div class="filters">
        <input id="f-search" type="search" placeholder="Filter tasks…   /" autocomplete="off">
        <select id="f-claim" title="Filter by claim">
          <option value="">All tasks</option>
          <option value="claimed">Claimed by an agent</option>
          <option value="stale">Stale claims</option>
          <option value="orphan">In progress, no agent</option>
          <option value="unclaimed">Unclaimed</option>
        </select>
        <select id="f-feature" title="Filter by feature"></select>
      </div>
      <div class="actions">
        <button class="btn hidden" id="btn-run">▶ Run <span id="run-count"></span></button>
        <button class="btn primary" id="btn-new">+ New task</button>
      </div>
    </header>
    <div class="board" id="board"></div>
  </main>
</div>

<aside class="panel" id="panel" aria-hidden="true"></aside>

<div class="modal-scrim" id="run-modal">
  <div class="modal">
    <h3>Run with Claude Code</h3>
    <p>Starts one <code>claude</code> session (<code>/goal</code>) to implement these tasks. They are moved to <b>in progress</b> and claimed by the run.</p>
    <div class="tasklist" id="run-tasklist"></div>
    <label for="run-perm">Permission mode</label>
    <select id="run-perm">
      <option value="bypassPermissions">bypassPermissions: fully unattended</option>
      <option value="acceptEdits">acceptEdits: auto-apply edits, prompt for the rest</option>
      <option value="plan">plan: read-only, no edits</option>
      <option value="default">default: prompt as usual</option>
    </select>
    <div class="warn" id="run-warn"></div>
    <div class="modal-actions">
      <button class="btn" id="run-cancel">Cancel</button>
      <button class="btn primary" id="run-go">▶ Start run</button>
    </div>
  </div>
</div>

<div class="runs-tray hidden" id="runs-tray">
  <div class="tray-head">Claude Code runs</div>
  <div id="runs-list"></div>
</div>

<div class="run-console" id="run-console">
  <div class="run-head" id="run-head">
    <span id="run-stat" class="run-stat"></span>
    <span id="run-title" class="run-title"></span>
    <button class="icon-btn" id="run-resume" title="Copy 'claude --resume' command">⧉</button>
    <button class="icon-btn" id="run-min" title="Minimize">▁</button>
    <button class="icon-btn" id="run-close" title="Close (the run keeps going)">×</button>
  </div>
  <div class="run-meta" id="run-meta"></div>
  <div class="run-events" id="run-events"></div>
</div>

<div id="toasts"></div>

<script src="board.js"></script>
<script src="panel.js"></script>
<script src="runs.js"></script>
</body>
</html>
